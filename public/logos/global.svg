<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <!-- Dynamic Blue Swirl Globe -->
  <g transform="translate(10, 10)">
    <circle cx="30" cy="30" r="28" fill="none" stroke="#2563EB" stroke-width="2" stroke-opacity="0.2"/>
    <path d="M16 38 C 12 24, 24 10, 38 12 C 50 14, 54 28, 48 38 C 42 48, 26 52, 18 42 C 14 36, 16 28, 22 24" fill="none" stroke="url(#blueGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M26 18 C 36 12, 48 20, 46 32 C 44 42, 32 46, 26 40" fill="none" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <defs>

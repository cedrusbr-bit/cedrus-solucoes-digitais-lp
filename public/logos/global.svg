      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- Typography -->
  <text x="82" y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">Global</text>
  <text x="84" y="56" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="2" fill="#60A5FA">SOLUÇÕES BR</text>
</svg>
